    { get:()=>State.tape.tracks[State.tape.activeTrack].vol, set:v=>State.tape.tracks[State.tape.activeTrack].vol=v, label:'Volume', min:0, max:120, step:1, fmt:v=>Math.round(v)+'%' },
    { get:()=>State.tape.tracks[State.tape.activeTrack].mute?1:0, set:v=>State.tape.tracks[State.tape.activeTrack].mute=v>=0.5, label:'Mute', min:0, max:1, step:1, fmt:v=>v>=0.5?'ON':'off' },
    { get:()=>0, set:v=>{ if(v>=0.5){ Tape.clearTrack(State.tape.activeTrack); } }, label:'Clear', min:0, max:1, step:1, fmt:v=>v>=0.5?'→':'clear' }
  ]
};

function encValue(cfg){ return cfg.get(); }
function encSet(cfg, val){
  val = Math.max(cfg.min, Math.min(cfg.max, val));
  cfg.set(val);
}
function refreshEncoders(){
  const cfgs = ENC_CONFIG[State.section] || [];
  for(let i=0;i<4;i++){
    const knob = document.querySelector('.knob[data-enc="'+i+'"]');
    const lbl = document.getElementById('encLbl'+i);
    const cfg = cfgs[i];
    if(!cfg){ lbl.textContent='—'; knob.querySelector('.mark').style.transform='rotate(0deg)'; continue; }
    const v = encValue(cfg);
    const t = (v - cfg.min)/(cfg.max - cfg.min);
    const deg = -140 + t*280;
    knob.querySelector('.mark').style.transform = 'rotate('+deg+'deg)';
    lbl.textContent = cfg.label+'\n'+cfg.fmt(v);
    lbl.style.whiteSpace = 'pre';
  }
  if(typeof refreshNumRow==='function') refreshNumRow();
}
function attachEncoders(){
  document.querySelectorAll('.knob').forEach(knob=>{
    let startY=0, startVal=0, cfg=null, dragging=false;
    function begin(y){
      const cfgs = ENC_CONFIG[State.section] || [];
      cfg = cfgs[+knob.dataset.enc];
      if(!cfg) return;
      dragging=true; startY=y; startVal=encValue(cfg);
    }
    function moveTo(y){
      if(!dragging||!cfg) return;
      const dy = startY - y;
      const range = cfg.max - cfg.min;
      let val = startVal + (dy/150)*range;
      if(cfg.step) val = Math.round(val/cfg.step)*cfg.step;
      encSet(cfg, val);
      refreshEncoders();
    }
    knob.addEventListener('mousedown', e=>{begin(e.clientY);});
    window.addEventListener('mousemove', e=>{if(dragging)moveTo(e.clientY);});
    window.addEventListener('mouseup', ()=>{dragging=false;});
    knob.addEventListener('touchstart', e=>{e.preventDefault();begin(e.touches[0].clientY);}, {passive:false});
    knob.addEventListener('touchmove', e=>{e.preventDefault();moveTo(e.touches[0].clientY);}, {passive:false});
    knob.addEventListener('touchend', e=>{dragging=false;}, {passive:false});
  });
}

/* ---------- Display (animated canvas) ---------- */
const Display = (() => {
  let cv, cx, W, H, dpr;
  let flashes = []; // {midi, t}
  function resize(){
    cv = document.getElementById('screen');
    const r = cv.parentElement.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    cv.width = r.width*dpr; cv.height = r.height*dpr;
    W = r.width; H = r.height;
    cx = cv.getContext('2d');
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  function flashNote(midi){ flashes.push({midi, t:performance.now()}); }
  function sectionColor(){
    return ({synth:'#f0821e',drum:'#2f6df0',tape:'#37c26b',seq:'#f4f1ea',fx:'#e5352b'})[State.section] || '#f0821e';
  }
  function draw(){
    if(!cx){ resize(); }
    const now = performance.now();
    // keep REC button in sync with the recorder in any section
    const _recBtn = document.getElementById('recBtn');
    const _recOn = Tape.isRecording();
    if(_recBtn && _recBtn.classList.contains('on') !== _recOn){ _recBtn.classList.toggle('on', _recOn); State.recording=_recOn; }
    cx.clearRect(0,0,W,H);
    // background
    cx.fillStyle = '#0b0f14'; cx.fillRect(0,0,W,H);
    cx.strokeStyle = 'rgba(255,255,255,.04)'; cx.lineWidth=1;
    for(let x=0;x<W;x+=20){ cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke(); }

    const col = sectionColor();
    // compact header: section + bpm/octave on one small line
    cx.fillStyle = col; cx.font = '700 10px monospace'; cx.textAlign='left';
    cx.fillText(State.section.toUpperCase(), 6, 12);
    // global REC indicator (when recording outside the TAPE view)
    if(Tape.isRecording() && State.section!=='tape' && Math.floor(now/400)%2===0){
      cx.fillStyle='#e5352b'; cx.beginPath(); cx.arc(W/2, 9, 4, 0, Math.PI*2); cx.fill();
      cx.font='700 8px monospace'; cx.fillText('REC T'+(State.tape.activeTrack+1), W/2+8, 12);
    }
    cx.fillStyle = 'rgba(255,255,255,.45)'; cx.font='600 9px monospace'; cx.textAlign='right';
    cx.fillText(State.bpm+'BPM 8va'+(State.octave>=0?'+':'')+State.octave, W-6, 12);
    cx.textAlign='left';

    if(State.section === 'synth'){
      drawSynth(now, col);
    } else if(State.section === 'drum'){
      drawDrum(now, col);
    } else if(State.section === 'seq'){
      drawSeq(now, col);
    } else if(State.section === 'fx'){
      drawFx(now, col);
    } else if(State.section === 'tape'){
      drawTape(now, col);
    } else {
      cx.fillStyle='rgba(255,255,255,.35)'; cx.font='600 11px monospace';
      cx.fillText('(in arrivo)', 6, H/2);
    }
    requestAnimationFrame(draw);
  }
  function gridCell(i, cols, x0, y0, w, h, gap){
    const cw = (w-gap*(cols-1))/cols;
    return { x: x0 + i*(cw+gap), y: y0, w: cw, h };
  }
  function drawDrum(now, col){
    const step = Sequencer.running ? Sequencer.uiStep : -1;
    const rows = DRUMS.length;
    const x0=6, y0=18, gw=W-12, gh=H-24;
    const rowH = gh/rows;
    const labW = 34;
    for(let r=0;r<rows;r++){
      const name = DRUMS[r];
      const sel = name===State.drum.selected;
      cx.fillStyle = sel ? col : 'rgba(255,255,255,.4)';
      cx.font = (sel?'700 ':'600 ')+'8px monospace';
      cx.fillText(DRUM_LABELS[name], x0, y0 + r*rowH + rowH*0.7);
      const cellsX = x0+labW;
      const cellsW = gw-labW;
      const cw = cellsW/16;
      for(let s=0;s<16;s++){
        const cx0 = cellsX + s*cw;
        const on = State.drum.pattern[name][s];
        cx.fillStyle = on ? col : 'rgba(255,255,255,.08)';
        if(s===step && Sequencer.running){ cx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.22)'; }
        cx.fillRect(cx0+0.5, y0 + r*rowH + 1, cw-1, rowH-2);
        if(s%4===0){ cx.fillStyle='rgba(255,255,255,.22)'; cx.fillRect(cx0, y0, 1, gh); }
      }
    }
  }
  function drawSeq(now, col){
    const sp = State.seq;
    cx.fillStyle=col; cx.font='700 9px monospace'; cx.textAlign='center';
    cx.fillText(sp.mode.toUpperCase()+' · '+SCALES[sp.scaleIdx].name, W/2, 12); cx.textAlign='left';
    const step = Sequencer.running ? Sequencer.uiStep : -1;
    const x0=6, y0=18, gw=W-12, gh=H-34;
    const cw = gw/16;
    for(let s=0;s<16;s++){
      const notes = sp.pattern[s];
      const isEdit = s===sp.editStep;
      cx.strokeStyle = isEdit ? col : 'rgba(255,255,255,.15)';
      cx.lineWidth = isEdit?2:1;
      cx.strokeRect(x0+s*cw+1, y0, cw-2, gh);
      if(s===step && Sequencer.running){ cx.fillStyle='rgba(255,255,255,.12)'; cx.fillRect(x0+s*cw+1,y0,cw-2,gh); }
      notes.forEach(m=>{
        const rel = (m - sp.root); const tt = Math.max(0,Math.min(1, 1-(rel/24)));
        cx.fillStyle = col;
        const yy = y0 + tt*(gh-6) + 3;
        cx.fillRect(x0+s*cw+2, yy-2, cw-4, 4);
      });
    }
    cx.fillStyle='rgba(255,255,255,.5)'; cx.font='600 8px monospace'; cx.textAlign='center';
    cx.fillText('step '+(sp.editStep+1)+'/16 — suona i tasti', W/2, H-3); cx.textAlign='left';
  }
  function drawFx(now, col){
    const f = State.fx;
    const items = [['Reverb',f.reverb,'%'],['Delay',f.delay,'%'],['DlyTime','1/'+(16/f.delayTime).toFixed(0),''],['Drive',f.drive,'%']];
    const x0=6, y0=26, gw=W-12;
    const rowH = (H-30)/4;
    items.forEach((it,i)=>{
      const y = y0 + i*rowH;
      cx.fillStyle='rgba(255,255,255,.6)'; cx.font='600 9px monospace';
      cx.fillText(it[0], x0, y+3);
      const bx=x0+52, bw=gw-80;
      cx.fillStyle='rgba(255,255,255,.1)'; cx.fillRect(bx,y-5,bw,10);
      const val = typeof it[1]==='number'? it[1]/100 : (f.delayTime/8);
      cx.fillStyle=col; cx.fillRect(bx,y-5,bw*val,10);
      cx.fillStyle='rgba(255,255,255,.75)'; cx.font='600 9px monospace'; cx.textAlign='right';
      cx.fillText((typeof it[1]==='number'?Math.round(it[1]):it[1])+it[2], W-6, y+3); cx.textAlign='left';
    });
  }
  function drawTape(now, col){
    // OP-1-style header: active track number + running timer
    const at = State.tape.activeTrack;
    cx.fillStyle=col; cx.font='700 10px monospace'; cx.textAlign='center';
    if(Tape.isRecording()){
      const d = Tape.diag();
      const secs = d.sr ? d.len/d.sr : 0;
      cx.fillStyle='#e5352b';
      cx.fillText('●REC '+secs.toFixed(1)+'s  peak '+d.peak.toFixed(2), W/2, 12);
    } else {
      let secs = 0; const b = State.tape.tracks[at].buffer; if(b) secs = b.duration;
      const mm = String(Math.floor(secs/60)).padStart(2,'0');
      const ss = String(Math.floor(secs%60)).padStart(2,'0');
      const cs = String(Math.floor((secs*100)%100)).padStart(2,'0');
      cx.fillText('▸'+(at+1)+'   '+mm+':'+ss+':'+cs, W/2, 12);
    }
    cx.textAlign='left';
    // 4 tape lanes (like scrolling tape)
    const x0=6, y0=18, gw=W-12, gh=H-22;
    const th = gh/4;
    for(let i=0;i<4;i++){
      const tr = State.tape.tracks[i];
      const active = i===at;
      const armed = Tape.recTrack===i;
      const y = y0 + i*th;
      cx.strokeStyle = active ? col : 'rgba(255,255,255,.16)';
      cx.lineWidth = active?2:1;
      cx.strokeRect(x0, y+1, gw, th-2);
      cx.fillStyle = armed ? '#e5352b' : (active?col:'rgba(255,255,255,.5)');
      cx.font='700 8px monospace';
      cx.fillText('T'+(i+1)+(tr.mute?'✕':'')+(armed?'●':''), x0+3, y+th*0.62);
      if(tr.buffer){
        const data = tr.buffer.getChannelData(0);
        const laneX = x0+26, laneW = gw-30, wy = y+th/2, wa = (th-6)/2;
        // timeline scale: full lane width represents the longest track * 1.0
        let maxDur = 0.001; State.tape.tracks.forEach(t=>{ if(t.buffer) maxDur=Math.max(maxDur,t.buffer.duration+Math.max(0,t.offset)); });
        const pxPerSec = laneW / maxDur;
        const startPx = laneX + Math.max(0,(tr.offset||0))*pxPerSec;
        const drawW = Math.min(laneW - (startPx-laneX), tr.buffer.duration*pxPerSec);
        cx.save();
        cx.beginPath(); cx.rect(laneX, y+1, laneW, th-2); cx.clip();
        cx.strokeStyle = tr.mute ? 'rgba(255,255,255,.2)' : (active?col:'rgba(255,255,255,.4)');
        cx.lineWidth=1; cx.beginPath();
        const stepN = Math.max(1, Math.floor(data.length/Math.max(1,drawW)));
        for(let px=0;px<drawW;px++){
          let min=1,max=-1;
          for(let s=0;s<stepN;s++){ const v=data[px*stepN+s]||0; if(v<min)min=v; if(v>max)max=v; }
          cx.moveTo(startPx+px, wy+min*wa); cx.lineTo(startPx+px, wy+max*wa);
        }
        cx.stroke();
        cx.restore();
        // offset badge
        if(tr.offset){ cx.fillStyle='rgba(255,255,255,.55)'; cx.font='600 7px monospace'; cx.textAlign='right';
          cx.fillText((tr.offset>0?'+':'')+tr.offset.toFixed(2)+'s', x0+gw-2, y+th*0.62); cx.textAlign='left'; }
      } else {
        cx.fillStyle='rgba(255,255,255,.22)'; cx.font='600 8px monospace';
        cx.fillText(armed?'rec…':'vuota — premi ●', x0+30, y+th*0.62);
      }
      // playhead line if playing
      if(Tape.playing && tr.buffer && !tr.mute){
        cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(W/2, y+1); cx.lineTo(W/2, y+th-1); cx.stroke();
      }
    }
  }
  function drawSynth(now, col){
    const s = State.synth;
    const active = Voices.active.size;
    const cxMid = H*0.60;
    cx.strokeStyle = col; cx.lineWidth = 2;
    cx.beginPath();
    const amp = active>0 ? H*0.20 : H*0.05;
    const t = now/300;
    for(let x=0;x<=W;x+=2){
      const ph = (x/W)*Math.PI*2* (s.engine==='fm'?3:2);
      let y;
      if(s.engine==='saw') y = ((x/W*4)%1)*2-1;
      else if(s.engine==='square') y = Math.sin(ph+t)>0?1:-1;
      else if(s.engine==='fm') y = Math.sin(ph + Math.sin(ph*s.fmRatio+t)*1.5);
      else y = Math.sin(ph+t);
      cx.lineTo(x, cxMid - y*amp);
    }
    cx.stroke();
    // note flashes
    flashes = flashes.filter(f => now - f.t < 700);
    flashes.forEach(f=>{
      const age = (now-f.t)/700;
      cx.globalAlpha = 1-age;
      cx.fillStyle = col;
      const fx = 8 + (f.midi%24)/24 * (W-16);
      const r = 3 + age*12;
      cx.beginPath(); cx.arc(fx, H*0.34, r, 0, Math.PI*2); cx.fill();
      cx.globalAlpha=1;
      cx.fillStyle='#fff'; cx.font='700 8px monospace'; cx.textAlign='center';
      cx.fillText(midiName(f.midi + State.octave*12), fx, H*0.34-r-3); cx.textAlign='left';
    });
    // engine name
    cx.fillStyle='rgba(255,255,255,.85)'; cx.font='700 13px monospace'; cx.textAlign='center';
    cx.fillText(({saw:'SAW',square:'SQUARE',sine:'SINE',fm:'FM'})[s.engine], W/2, H-4);
    cx.textAlign='left';
  }
  return { resize, flashNote, start(){ resize(); draw(); },
    get W(){ return W; }, get H(){ return H; } };
})();

/* ---------- Screen touch: tap the display to edit the active section ---------- */
function attachScreenTouch(){
  const cv = document.getElementById('screen');
  function handle(clientX, clientY){
    AudioEngine.ensure(); AudioEngine.resume();
    const r = cv.getBoundingClientRect();
    const px = clientX - r.left, py = clientY - r.top;
    const W = Display.W, H = Display.H;
    if(!W || !H) return;
    const sec = State.section;
    if(sec==='drum'){
      // grid: x0=6,y0=18,labW=34,16 cols, DRUMS rows
      const x0=6,y0=18,gw=W-12,gh=H-24,labW=34;
      const rows=DRUMS.length, rowH=gh/rows;
      const cellsX=x0+labW, cellsW=gw-labW, cw=cellsW/16;
      if(py<y0) return;
      const r2=Math.floor((py-y0)/rowH);
      if(r2<0||r2>=rows) return;
      if(px < cellsX){ State.drum.selected = DRUMS[r2]; refreshEncoders(); return; } // tap label = select voice
      const s=Math.floor((px-cellsX)/cw);
      if(s>=0&&s<16){ const name=DRUMS[r2]; State.drum.pattern[name][s]=!State.drum.pattern[name][s];
        if(State.drum.pattern[name][s]) playDrum(name, AudioEngine.now()+0.001,false); }
    } else if(sec==='seq'){
      const x0=6,y0=18,gw=W-12,gh=H-34,cw=gw/16;
      if(py<y0||py>y0+gh) return;
      const s=Math.floor((px-x0)/cw);
      if(s>=0&&s<16){ State.seq.editStep=s; } // tap a column to move the edit step
    } else if(sec==='tape'){
      const x0=6,y0=18,gh=H-22,th=gh/4;
      const i=Math.floor((py-y0)/th);
      if(i>=0&&i<4){ State.tape.activeTrack=i; refreshEncoders();
        // begin a drag on this lane (to move the track in time)
        drag = { track:i, startX:px, startOffset: State.tape.tracks[i].offset||0, moved:false };
      }
    } else if(sec==='synth'){
      // tap cycles engine
      const i=(ENGINES.indexOf(State.synth.engine)+1)%ENGINES.length;
      State.synth.engine=ENGINES[i]; refreshEncoders(); toast('Engine: '+['Saw','Square','Sine','FM'][i]);
    } else if(sec==='fx'){
      // tap a row and set value by x position
      const y0=26,rowH=(H-30)/4, bx=6+52, bw=(W-12)-80;
      const row=Math.floor((py-y0)/rowH+0.5);
      const val=Math.max(0,Math.min(1,(px-bx)/bw));
      if(row===0){ State.fx.reverb=Math.round(val*100); }
      else if(row===1){ State.fx.delay=Math.round(val*100); }
      else if(row===2){ State.fx.delayTime=Math.max(1,Math.round(val*8)); }
      else if(row===3){ State.fx.drive=Math.round(val*100); }
      FX.update(); refreshEncoders();
    }
    refreshNumRow();
  }
  // drag state for moving tape tracks in time
  let drag = null;
  function moveDrag(clientX){
    if(!drag) return;
    const r = cv.getBoundingClientRect();
    const px = clientX - r.left;
    const W = Display.W; if(!W) return;
    const dx = px - drag.startX;
    // map full screen width to a +/- window; longest track defines the scale
    let maxDur = 1;
    State.tape.tracks.forEach(t=>{ if(t.buffer) maxDur=Math.max(maxDur, t.buffer.duration); });
    const secondsPerPixel = (maxDur*1.5) / W;
    let newOff = drag.startOffset + dx*secondsPerPixel;
    newOff = Math.max(-maxDur, Math.min(maxDur, newOff));
    State.tape.tracks[drag.track].offset = newOff;
    if(Math.abs(dx)>3) drag.moved = true;
  }
  function endDrag(){
    if(drag && drag.moved){
      const off = State.tape.tracks[drag.track].offset;
      toast('T'+(drag.track+1)+' spostata a '+(off>=0?'+':'')+off.toFixed(2)+'s');
      if(Tape.playing){ Tape.startPlay(); } // re-sync playback with new offset
    }
    drag = null;
  }
  cv.addEventListener('mousedown', e=>{ handle(e.clientX,e.clientY); });
  window.addEventListener('mousemove', e=>{ if(drag) moveDrag(e.clientX); });
  window.addEventListener('mouseup', ()=>{ endDrag(); });
  cv.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; handle(t.clientX,t.clientY); }, {passive:false});
  cv.addEventListener('touchmove', e=>{ if(drag){ e.preventDefault(); moveDrag(e.changedTouches[0].clientX); } }, {passive:false});
  cv.addEventListener('touchend', e=>{ endDrag(); }, {passive:false});
}

/* ---------- Section tabs ---------- */
function setSection(sec){
  State.section = sec;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.sec===sec));
  refreshEncoders();
  refreshNumRow();
}
document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{ AudioEngine.ensure(); AudioEngine.resume(); setSection(b.dataset.sec); });
});

/* ---------- Functional 1-8 keys (context dependent) ----------
   SYNTH: 1-4 select engine (Saw/Square/Sine/FM)
   DRUM : 1-8 select the drum voice to edit
   TAPE : 1-4 select track; 5-8 toggle mute of track 1-4
   SEQ  : 1-5 select scale; 6-8 select mode (Endless/Finger/Tombola)
   FX   : 1-4 quick presets (dry / space / dub / crush)
*/
function numKeyAction(n){
  AudioEngine.ensure(); AudioEngine.resume();
  const sec = State.section;
  if(sec==='synth'){
    if(n<4){ State.synth.engine = ENGINES[n]; toast('Engine: '+['Saw','Square','Sine','FM'][n]); }
  } else if(sec==='drum'){
    State.drum.selected = DRUMS[n]; toast('Drum: '+DRUM_LABELS[DRUMS[n]]);
    playDrum(DRUMS[n], AudioEngine.now()+0.001, false);
  } else if(sec==='tape'){
    if(n<4){ State.tape.activeTrack = n; toast('Traccia '+(n+1)); }
    else { const ti=n-4; State.tape.tracks[ti].mute=!State.tape.tracks[ti].mute; toast('T'+(ti+1)+(State.tape.tracks[ti].mute?' mute':' on')); }
  } else if(sec==='seq'){
    if(n<SCALES.length){ State.seq.scaleIdx=n; toast('Scala: '+SCALES[n].name); }
    else { const modes=['endless','finger','tombola']; const mi=n-SCALES.length; if(modes[mi]){ State.seq.mode=modes[mi]; toast('Modo: '+modes[mi]); } }
  } else if(sec==='fx'){
    const presets=[[0,0,0,0],[40,20,3,0],[30,60,4,0],[10,20,3,60]];
    const names=['Dry','Space','Dub','Crush'];
    if(n<4){ const p=presets[n]; State.fx.reverb=p[0];State.fx.delay=p[1];State.fx.delayTime=p[2];State.fx.drive=p[3];FX.update();toast('FX: '+names[n]); }
  }
  refreshEncoders(); refreshNumRow();
}
function refreshNumRow(){
  const sec = State.section;
  const labels = {
    synth:['Saw','Squa','Sine','FM','','','',''],
    drum: DRUMS.map(d=>DRUM_LABELS[d]),
    tape: ['T1','T2','T3','T4','M1','M2','M3','M4'],
    seq:  ['Major','Minor','Dorian','Penta','Chrom','Endl','Fing','Tomb'],
    fx:   ['Dry','Space','Dub','Crush','','','','']
  }[sec] || ['','','','','','','',''];
  for(let i=0;i<8;i++){
    const btn = document.querySelector('.numk[data-num="'+i+'"]');
    const span = document.getElementById('numlbl'+i);
    span.textContent = labels[i] || '';
    btn.style.visibility = labels[i] ? 'visible' : 'hidden';
    // active/on highlight
    let active=false, on=false;
    if(sec==='synth') active = ENGINES[i]===State.synth.engine;
    else if(sec==='drum') active = DRUMS[i]===State.drum.selected;
    else if(sec==='tape'){ if(i<4) active = i===State.tape.activeTrack; else on = State.tape.tracks[i-4] && State.tape.tracks[i-4].mute; }
    else if(sec==='seq'){ if(i<SCALES.length) active = i===State.seq.scaleIdx; else { const modes=['endless','finger','tombola']; active = modes[i-SCALES.length]===State.seq.mode; } }
    btn.classList.toggle('active', !!active);
    btn.classList.toggle('on', !!on);
  }
}
document.querySelectorAll('.numk').forEach(btn=>{
  btn.addEventListener('click', ()=>numKeyAction(+btn.dataset.num));
});
// number keys 1-8 on computer keyboard
window.addEventListener('keydown', e=>{
  if(e.key>='1' && e.key<='8'){ numKeyAction(+e.key-1); }
});

/* ---------- Transport ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
document.getElementById('playBtn').addEventListener('click', ()=>{
  AudioEngine.ensure(); AudioEngine.resume();
  State.playing = !State.playing;
  document.getElementById('playBtn').classList.toggle('on', State.playing);
  if(State.section === 'tape'){
    if(State.playing) Tape.startPlay(); else Tape.stopPlay();
  } else {
    if(State.playing) Sequencer.start(); else Sequencer.stop();
  }
  toast(State.playing ? 'Play' : 'Stop');
});
document.getElementById('recBtn').addEventListener('click', ()=>{
  AudioEngine.ensure(); AudioEngine.resume();
  // REC always records a tape track, from ANY section, so you can capture
  // synth, drum machine, sequencer — whatever is playing.
  if(Tape.isRecording()){
    Tape.stopRec();
  } else {
    // pick the currently selected tape track; if it already has audio, jump to next empty one
    let tk = State.tape.activeTrack;
    if(State.tape.tracks[tk].buffer){
      const empty = State.tape.tracks.findIndex(t=>!t.buffer);
      if(empty >= 0){ tk = empty; State.tape.activeTrack = empty; }
    }
    Tape.startRec(tk);
    if(State.section !== 'tape') toast('REC su T'+(tk+1)+' — suona (● per fermare)');
  }
  const on = Tape.isRecording();
  State.recording = on;
  document.getElementById('recBtn').classList.toggle('on', on);
});
document.getElementById('metroBtn').addEventListener('click', ()=>{
  State.metro = !State.metro;
  document.getElementById('metroBtn').classList.toggle('on', State.metro);
  toast('Metronomo '+(State.metro?'on':'off'));
});
// MIC: toggle microphone as a recording source
document.getElementById('micBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('micBtn');
  if(AudioEngine.micActive()){
    AudioEngine.disableMic(); btn.classList.remove('on'); toast('Microfono off');
  } else {
    toast('Richiesta accesso microfono…');
    const ok = await AudioEngine.enableMic();
    if(ok){ btn.classList.add('on'); toast('Microfono ON — premi ● per registrare'); }
    else { toast('Microfono negato o non disponibile'); }
  }
});
// ARP: cycle off -> up -> down -> updown -> random -> off
const ARP_CYCLE = [null,'up','down','updown','random'];
const ARP_LABEL = {up:'↑Up',down:'↓Dn',updown:'↕UpDn',random:'🔀Rnd'};
document.getElementById('arpBtn').addEventListener('click', ()=>{
  AudioEngine.ensure(); AudioEngine.resume();
  let i = ARP_CYCLE.indexOf(State.arp.on ? State.arp.dir : null);
  i = (i+1) % ARP_CYCLE.length;
  const next = ARP_CYCLE[i];
  const btn = document.getElementById('arpBtn');
  if(next===null){ Arp.setEnabled(false); btn.classList.remove('on'); btn.textContent='ARP'; toast('Arp off'); }
  else { State.arp.dir=next; Arp.setEnabled(true); btn.classList.add('on'); btn.textContent='ARP '+ARP_LABEL[next]; toast('Arp '+ARP_LABEL[next]); }
});
function setBpm(v){ State.bpm = Math.max(40, Math.min(240, Math.round(v)||120));
  const inp=document.getElementById('bpmInput'); if(inp && document.activeElement!==inp) inp.value = State.bpm;
  if(typeof FX!=='undefined') FX.update(); }
document.getElementById('bpmUp').addEventListener('click', ()=>setBpm(State.bpm+1));
document.getElementById('bpmDown').addEventListener('click', ()=>setBpm(State.bpm-1));
(function(){
  const inp=document.getElementById('bpmInput');
  // live update as you type; clamp on blur/enter
  inp.addEventListener('input', ()=>{ const v=parseInt(inp.value,10); if(!isNaN(v)) setBpm(v); });
  inp.addEventListener('blur', ()=>{ inp.value=State.bpm; });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ inp.blur(); } e.stopPropagation(); });
})();
function setOctave(v){ State.octave = Math.max(-2, Math.min(2, v)); toast('Ottava '+(State.octave>=0?'+':'')+State.octave); }
document.getElementById('octUp').addEventListener('click', ()=>setOctave(State.octave+1));
document.getElementById('octDown').addEventListener('click', ()=>setOctave(State.octave-1));
document.getElementById('expWav').addEventListener('click', ()=>Export.exportAs('wav'));
document.getElementById('expMp3').addEventListener('click', ()=>Export.exportAs('mp3'));

/* ---------- Save / Load dialog ---------- */
const projDlg = document.getElementById('projDlg');
function renderProjList(){
  const wrap = document.getElementById('projList');
  const items = Project.list().sort((a,b)=>b.savedAt-a.savedAt);
  if(!items.length){ wrap.innerHTML = '<div class="empty">Nessun progetto salvato.<br>Scrivi un nome e premi Salva.</div>'; return; }
  wrap.innerHTML = '';
  items.forEach(e=>{
    const row = document.createElement('div'); row.className='prj';
    const d = new Date(e.savedAt);
    row.innerHTML = '<span class="pn"></span><span class="pd"></span><button class="load">📂 Apri</button><button class="del">🗑</button>';
    row.querySelector('.pn').textContent = e.name;
    row.querySelector('.pd').textContent = d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    row.querySelector('.load').addEventListener('click', ()=>{ Project.load(e.id); closeProj(); });
    row.querySelector('.del').addEventListener('click', ()=>{ if(confirm('Eliminare "'+e.name+'"?')){ Project.remove(e.id); renderProjList(); } });
    wrap.appendChild(row);
  });
}
function openProj(){ AudioEngine.ensure(); AudioEngine.resume(); renderProjList(); projDlg.classList.add('show'); }
function closeProj(){ projDlg.classList.remove('show'); }
document.getElementById('saveBtn').addEventListener('click', ()=>{ openProj(); const n=document.getElementById('projName'); n.focus(); });
document.getElementById('loadBtn').addEventListener('click', openProj);
document.getElementById('projClose').addEventListener('click', closeProj);
projDlg.addEventListener('click', e=>{ if(e.target===projDlg) closeProj(); });
document.getElementById('projSaveGo').addEventListener('click', ()=>{
  const inp=document.getElementById('projName');
  if(Project.save(inp.value)){ inp.value=''; renderProjList(); }
});
document.getElementById('projName').addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter'){ document.getElementById('projSaveGo').click(); } });

/* ---------- Orientation ---------- */
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  document.getElementById('rotate').style.display = (portrait && window.innerWidth < 620) ? 'flex' : 'none';
  Display.resize();
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', ()=>setTimeout(checkOrientation,200));

/* ---------- Init ---------- */
function init(){
  initPatterns();
  buildKeyboard();
  attachEncoders();
  attachScreenTouch();
  refreshEncoders();
  refreshNumRow();
  Display.start();
  checkOrientation();
  setBpm(State.bpm);
  toast('op-Crudo pronto');
}
init();

/* ---------- PWA: register service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed:', err));
  });
}
</script>
